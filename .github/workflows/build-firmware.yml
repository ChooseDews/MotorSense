# Builds the MotorSense ESP32-S3 firmware from sdkconfig.unified.
#
# The artifact contains:
#   - the app binary (motorsense-v1.0.0.bin) — for OTA or app-only flashing
#   - the merged flash-all image             — one file that covers bootloader,
#                                              partition table, otadata and app
#   - the ELF (for addr2line / symbol decoding)
#
# One image serves every device: axis role (YAW/PITCH) and calibration are
# runtime settings stored in NVS (see firmware/README.md).
#
# NOTE: builds always pin SDKCONFIG to sdkconfig.unified. The repo-root
# firmware/sdkconfig is a stale leftover and must not be used.

name: Firmware Build

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

env:
  IDF_VERSION: v5.5.1
  TARGET: esp32s3
  PROJECT_VER: 1.0.0

jobs:
  build:
    name: Build motorsense (esp32s3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: ${{ env.TARGET }}
          path: firmware
          command: >
            idf.py -B build -D SDKCONFIG=sdkconfig.unified build &&
            idf.py -B build merge-bin

      - name: Collect binaries
        run: |
          mkdir -p artifacts
          cp firmware/build/motorsense-v${PROJECT_VER}.bin  artifacts/
          cp firmware/build/motorsense.elf                  artifacts/
          cp firmware/build/merged-binary.bin               artifacts/motorsense-flash-all.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: motorsense-firmware
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
